<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- SEO -->
  <title>寺師史晃 | Terashi Fumiaki |</title>
  <meta name="description" content="寺師史晃（Terashi Fumiaki）" />
  <meta name="robots" content="index, follow" />

  <!-- 構造化データ -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "寺師史晃",
    "alternateName": "Terashi Fumiaki",
    "jobTitle": "Cloud Engineer",
    "url": "https://TerashiFumiaki.github.io/"
  }
  </script>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      width: 340px;
      margin: 0 auto;
    }

    h1, .sub, .role, .contact {
      text-align: center;
    }

    h1 {
      font-size: 26px;
      margin: 0;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .sub {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 10px;
    }

    .role {
      font-size: 13px;
      color: #38bdf8;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .contact {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.1);
      margin: 20px 0;
    }

    .mail-img {
      display: block;
      margin: 0 auto;
      max-width: 300px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>寺師 史晃</h1>
    <div class="sub">Terashi Fumiaki</div>
    <div class="contact">Feel free to reach out anytime.</div>
    <div class="divider"></div>
    <img src="mail.png" alt="email" class="mail-img">
  </div>
</body>
</html>
